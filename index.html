<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Girly Stone Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1> Stone Paper Scissors </h1>
    <div class="score-board">
        <p>ME: <span id="user-score">0</span></p>
        <p>YOU: <span id="comp-score">0</span></p>
    </div>
    <div class="container">
        <div class="choice" onclick="playGame('stone')">
            <img src="image.png">
        </div>

        <div class="choice" onclick="playGame('paper')">
            <img src="images (2).png">
        </div>

        <div class="choice" onclick="playGame('scissors')">
            <img src="67ebfd32e898b4ec3ae4e59ae33832c8.jpg">
        </div>
    </div>

    <h2 id="result">Choose your move </h2>

    <script src="app.js"></script>
</body>
</html>
